<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TCompiler</title>
    <link rel="stylesheet" href="style.css" />
    <script
      type="text/javascript"
      src="https://cdnjs.cloudflare.com/ajax/libs/vis/4.21.0/vis.js"
    ></script>

    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/vis/4.21.0/vis-network.min.css"
      rel="stylesheet"
      type="text/css"
    />
  </head>
  <body>
    <main>
      <h2>Optim</h2>
      <section class="row">
        <textarea
          class="code-textarea textarea-problem-input"
          spellcheck="false"
          autocorrect="off"
          autocapitalize="off"
          translate="no"
        ></textarea>
      </section>
      <section class="col">
        <p>Constrained</p>
        <section class="row">
          <textarea
            class="code-textarea textarea-problem-constrained"
            spellcheck="false"
            autocorrect="off"
            autocapitalize="off"
            translate="no"
            readonly
          ></textarea>
        </section>
        <p>Unconstrained</p>
        <section class="row">
          <textarea
            class="code-textarea textarea-problem-unconstrained"
            spellcheck="false"
            autocorrect="off"
            autocapitalize="off"
            translate="no"
            readonlyF
          ></textarea>
        </section>
      </section>
      <section class="col">
        <section class="row">
          <label
            >p:
            <input
              type="number"
              min="0.0001"
              max="0.1"
              value="0.01"
              class="input-p"
          /></label>
          <label>
            Steps:
            <input
              type="number"
              min="1"
              max="1000"
              value="32"
              class="input-steps"
            />
          </label>
          <button class="btn-optimize">optimize</button>
          <button class="btn-clear">clear</button>
        </section>
        <section class="row">
          <label
            >min:
            <input type="number" min="0" value="0" class="input-params-min"
          /></label>
          <label>
            max:
            <input type="number" min="0" value="1" class="input-params-max" />
          </label>
          <button class="btn-randomize">randomize</button>
        </section>
        <section class="col learning-container"></section>
      </section>

      <label class="label"
        ><input type="checkbox" class="checkbox-expand" /><span
          >Show Details</span
        ></label
      >
      <div class="expandable">
        <h2>Details</h2>
        <section class="col">
          <p>Lex tokens</p>
          <textarea
            class="code-textarea textarea-lex-tokens"
            spellcheck="false"
            autocorrect="off"
            autocapitalize="off"
            translate="no"
            readonly
          ></textarea>
        </section>
        <section class="col">
          <p>Syntax tokens</p>
          <textarea
            class="code-textarea textarea-syntax-tokens"
            spellcheck="false"
            autocorrect="off"
            autocapitalize="off"
            translate="no"
            readonly
          ></textarea>
        </section>
        <section class="col">
          <p>Initial AST</p>
          <div class="network node-network-ast"></div>
        </section>
        <section class="col">
          <p>Simplified AST</p>
          <div class="network node-network-ast-simplified"></div>
        </section>
        <section class="col">
          <p>Unconstrained AST</p>
          <div class="network node-network-ast-unconstrained"></div>
        </section>
        <section class="col">
          <p>Network to optimize</p>
          <div class="network node-network-grad"></div>
        </section>
        <section class="col">
          <p>Grammar</p>
          <textarea
            class="code-textarea textarea-grammar"
            spellcheck="false"
            autocorrect="off"
            autocapitalize="off"
            translate="no"
            readonly
          ></textarea>
        </section>
        <section class="col">
          <p>Grammar states</p>
          <div class="network node-network-grammar-states"></div>
        </section>
        <section class="col scroll">
          <p>Grammar tables</p>
          <div class="grammar-tables"></div>
        </section>
      </div>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
